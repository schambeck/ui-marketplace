version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:18.20-browsers
    working_directory: ~/ui-marketplace
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci --legacy-peer-deps
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build
          command: npm run build --if-present
      - run:
          name: Configure Chrome binary
          command: |
            CHROME_BIN_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
            if [ -z "$CHROME_BIN_PATH" ]; then
              echo "No supported Chrome/Chromium binary found in the CircleCI image."
              exit 1
            fi
            echo "export CHROME_BIN=$CHROME_BIN_PATH" >> "$BASH_ENV"
      - run:
          name: Test
          command: npm run test-headless

workflows:
  build:
    jobs:
      - build-and-test
