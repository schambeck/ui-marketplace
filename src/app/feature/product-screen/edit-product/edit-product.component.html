<p-panel header="Product">
  <p-card class="p-0 shadow-8">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Back" (onClick)="back()" icon="pi pi-arrow-left" styleClass="mr-2"></p-button>
          <p-button label="Save" (onClick)="save()" icon="pi pi-save" [loading]="saving"></p-button>
        </div>
      </p-toolbar>
    </ng-template>
    <div *ngIf="product$ | async as product else loading" class="grid">

      <div class="field col-6">
        <label for="id" class="block font-bold">Id</label>
        <p-inputNumber id="id" [size]="25" [(ngModel)]="product.id" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-6">
        <label for="name" class="block font-bold">Name</label>
        <input id="name" type="text" class="w-full" [(ngModel)]="product.name" pInputText >
      </div>
      <div class="field col-6">
        <label for="description" class="block font-bold">Description</label>
        <input id="description" type="text" class="w-full" [(ngModel)]="product.description" pInputText >
      </div>
      <div class="field col-6">
        <label for="price" class="block font-bold">Price</label>
        <p-inputNumber id="price" [size]="25" [(ngModel)]="product.price" [minFractionDigits]="2" [maxFractionDigits]="2" inputId="currency-us" mode="currency" currency="USD" locale="en-US" ></p-inputNumber>
      </div>

      <div class="field col-6">
        <label for="quantity" class="block font-bold">Quantity</label>
        <p-inputNumber id="quantity" [size]="25" [(ngModel)]="product.quantity" [minFractionDigits]="2" [maxFractionDigits]="2" inputId="currency-us" mode="currency" currency="USD" locale="en-US" ></p-inputNumber>
      </div>

      <div class="field col-6">
        <label for="user" class="block font-bold">User</label>
        <app-user-autocomplete id="user" [(selectedItem)]="product.user"></app-user-autocomplete>
      </div>

      <div class="field col-6">
        <label for="category" class="block font-bold">Category</label>
        <input id="category" type="text" class="w-full" [(ngModel)]="product.category" pInputText>
      </div>

      <div class="field col-6">
        <label for="inventoryStatus" class="block font-bold">Inventory Status</label>
        <input id="inventoryStatus" type="text" class="w-full" [(ngModel)]="product.inventoryStatus" pInputText>
      </div>

      <div class="field col-6">
        <label for="rating" class="block font-bold">Rating</label>
        <p-rating id="rating" [(ngModel)]="product.rating"></p-rating>
      </div>

      <div class="field col-6">
        <label for="objectId" class="block font-bold">Image</label>
        <p-fileUpload id="objectId"
                      name="file"
                      [url]="environment.baseUrl + '/products/upload'"
                      (onUpload)="onUpload($event, product)"
                      accept="image/*"
                      [maxFileSize]="1000000">
          <ng-template pTemplate="content">
            <div *ngIf="uploadedFile.size">
              <p-image class="shadow-2 block xl:block mx-auto border-round" [src]="uploadedFile.objectURL" [alt]="product.name" />
            </div>
            <div *ngIf="!uploadedFile.size" class="text-center">
              <div class="pb-2">Current Image</div>
              <p-image class="shadow-2 block xl:block mx-auto border-round" [src]="getImageUrl(product.objectId)" [alt]="product.name" [preview]="true" />
            </div>
          </ng-template>
        </p-fileUpload>
      </div>

      <div class="field col-6">
        <label for="version" class="block font-bold">Version</label>
        <p-inputNumber id="version" [size]="25" [(ngModel)]="product.version" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-6">
        <label for="createdAt" class="block font-bold">CreatedAt</label>
        <p-calendar id="createdAt" dateFormat="yy-mm-dd" [(ngModel)]="product.createdAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

      <div class="field col-6">
        <label for="modifiedAt" class="block font-bold">ModifiedAt</label>
        <p-calendar id="modifiedAt" dateFormat="yy-mm-dd" [(ngModel)]="product.modifiedAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

    </div>
    <ng-template #loading>
      <div class="grid">
        <div class="field col-6"><label for="id" class="block font-bold">Id</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="name" class="block font-bold">Name</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="description" class="block font-bold">Description</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="price" class="block font-bold">Price</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="quantity" class="block font-bold">Quantity</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="user" class="block font-bold">User</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="version" class="block font-bold">Version</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="createdAt" class="block font-bold">CreatedAt</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-6"><label for="modifiedAt" class="block font-bold">ModifiedAt</label><p-skeleton height="2.75rem"></p-skeleton></div>
      </div>
    </ng-template>
  </p-card>
</p-panel>
