<p-panel header="Produto">
  <p-card class="p-0 shadow-8">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Voltar" (onClick)="back()" icon="pi pi-arrow-left" styleClass="mr-2"></p-button>
          <p-button label="Salvar" (onClick)="save()" icon="pi pi-save" [loading]="saving"></p-button>
        </div>
      </p-toolbar>
    </ng-template>
    <div *ngIf="product$ | async as product else loading" class="grid">

      <div class="field col-12 md:col-6">
        <label for="id" class="block font-bold">Id</label>
        <p-inputNumber inputId="id" [size]="25" [(ngModel)]="product.id" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="name" class="block font-bold">Nome</label>
        <input id="name" type="text" class="w-full" [(ngModel)]="product.name" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="description" class="block font-bold">Descrição</label>
        <input id="description" type="text" class="w-full" [(ngModel)]="product.description" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="price" class="block font-bold">Preço</label>
        <p-inputNumber [size]="25" [(ngModel)]="product.price" [minFractionDigits]="2" [maxFractionDigits]="2" inputId="price" mode="currency" currency="USD" locale="en-US" ></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="quantity" class="block font-bold">Quantidade</label>
        <p-inputNumber inputId="quantity" [(ngModel)]="product.quantity" [maxFractionDigits]="0"></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="user" class="block font-bold">Usuário</label>
        <app-user-autocomplete id="user" [(selectedItem)]="product.user"></app-user-autocomplete>
      </div>

      <div class="field col-12 md:col-6">
        <label for="category" class="block font-bold">Categoria</label>
        <input id="category" type="text" class="w-full" [(ngModel)]="product.category" pInputText>
      </div>

      <div class="field col-12 md:col-6">
        <label for="inventoryStatus" class="block font-bold">Status do estoque</label>
        <input id="inventoryStatus" type="text" class="w-full" [(ngModel)]="product.inventoryStatus" pInputText>
      </div>

      <div class="field col-12 md:col-6">
        <label for="rating" class="block font-bold">Avaliação</label>
        <p-rating inputId="rating" [(ngModel)]="product.rating"></p-rating>
      </div>

      <div class="field col-12 md:col-6">
        <label for="version" class="block font-bold">Versão</label>
        <p-inputNumber inputId="version" [size]="25" [(ngModel)]="product.version" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="createdAt" class="block font-bold">Criado em</label>
        <p-calendar inputId="createdAt" dateFormat="yy-mm-dd" [(ngModel)]="product.createdAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

      <div class="field col-12 md:col-6">
        <label for="modifiedAt" class="block font-bold">Atualizado em</label>
        <p-calendar inputId="modifiedAt" dateFormat="yy-mm-dd" [(ngModel)]="product.modifiedAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

      <div class="field col-12 md:col-6">
        <label class="block font-bold">Imagens</label>
        <p-fileUpload mode="basic"
                      name="file"
                      [url]="environment.baseUrl + '/object-storage/upload-file'"
                      (onUpload)="onUpload($event, product)"
                      accept="image/*"
                      [maxFileSize]="1000000"
                      [auto]="true">
        </p-fileUpload>
        <div *ngIf="images$ | async as images else loadingGalleria">
          <p-galleria [value]="images" [showItemNavigators]="true" [responsiveOptions]="responsiveOptions" [circular]="true" [numVisible]="5" [containerStyle]="{ 'max-width': '400px' }">
            <ng-template pTemplate="item" let-item>
              <img [src]="getImageUrl(item.objectId)" style="width: 100%; display: block;" />
            </ng-template>
            <ng-template pTemplate="thumbnail" let-item>
              <div class="grid grid-nogutter justify-content-center">
                <img [src]="getImageUrl(item.objectId)" style="display: block; width: 80px; height: 60px;" />
              </div>
            </ng-template>
          </p-galleria>
        </div>
        <ng-template #loadingGalleria>
          <p-progressSpinner></p-progressSpinner>
        </ng-template>
      </div>
    </div>
    <ng-template #loading>
      <div class="grid">
        <div class="field col-12 md:col-6"><label for="id" class="block font-bold">Id</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="name" class="block font-bold">Nome</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="description" class="block font-bold">Descrição</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="price" class="block font-bold">Preço</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="quantity" class="block font-bold">Quantidade</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="user" class="block font-bold">Usuário</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="version" class="block font-bold">Versão</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="createdAt" class="block font-bold">Criado em</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="modifiedAt" class="block font-bold">Atualizado em</label><p-skeleton height="2.75rem"></p-skeleton></div>
      </div>
    </ng-template>
  </p-card>
</p-panel>
