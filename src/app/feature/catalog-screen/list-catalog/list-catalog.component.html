<p-panel header="Catalog">
  <p-card class="p-0">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
        </div>
        <div class="p-toolbar-group-center">
          <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input type="text" pInputText placeholder="Search" (keyup)="search(getValue($event))" />
          </span>
          <p-button label="Refresh" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading" pTooltip="Refresh" tooltipPosition="left"></p-button>
        </div>
        <div class="p-toolbar-group-end">
        </div>
      </p-toolbar>
    </ng-template>
    <div *ngIf="page$ | async as page; else skeleton">
      <p-dataView #dv [value]="page.content" [layout]="layout">
        <ng-template pTemplate="header">
          <p-toolbar>
            <div class="p-toolbar-group-start">
            </div>
            <div class="p-toolbar-group-center">
              <p-dataViewLayoutOptions></p-dataViewLayoutOptions>
            </div>
            <div class="p-toolbar-group-end">
            </div>
          </p-toolbar>
        </ng-template>
        <ng-template let-product pTemplate="listItem">
          <div class="col-12">
            <div class="flex flex-column xl:flex-row xl:align-items-start p-4 gap-4">
              <img class="w-9 sm:w-16rem xl:w-10rem shadow-2 block xl:block mx-auto border-round" [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image" [alt]="product.name" />
              <div class="flex flex-column sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                <div class="flex flex-column align-items-center sm:align-items-start gap-3">
                  <div class="text-2xl font-bold text-900">{{ product.name }}</div>
                  <p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>
                  <div class="flex align-items-center gap-3">
                            <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag"></i>
                                <span class="font-semibold">{{ product.category }}</span>
                            </span>
                    <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product)"></p-tag>
                  </div>
                </div>
                <div class="flex sm:flex-column align-items-center sm:align-items-end gap-3 sm:gap-2">
                  <span class="text-2xl font-semibold">{{ '$' + product.price }}</span>
                  <button pButton icon="pi pi-shopping-cart" class="md:align-self-end mb-2 p-button-rounded" [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"></button>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <ng-template let-product pTemplate="gridItem">
          <div class="col-12 sm:col-6 lg:col-12 xl:col-4 p-2">
            <div class="p-4 border-1 surface-border surface-card border-round">
              <div class="flex flex-wrap align-items-center justify-content-between gap-2">
                    <span class="flex align-items-center gap-2">
                        <i class="pi pi-tag"></i>
                        <span class="font-semibold">{{ product.category }}</span>
                    </span>
                <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product)"></p-tag>
              </div>
              <div class="flex flex-column align-items-center gap-3 py-5">
                <img class="w-9 shadow-2 border-round" [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image" [alt]="product.name" />
                <div class="text-2xl font-bold">{{ product.name }}</div>
                <p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>
              </div>
              <div class="flex align-items-center justify-content-between">
                <span class="text-2xl font-semibold">{{ '$' + product.price }}</span>
                <button pButton icon="pi pi-shopping-cart" class="p-button-rounded" [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"></button>
              </div>
            </div>
          </div>
        </ng-template>
      </p-dataView>
    </div>

    <ng-template #skeleton>
      <p-table styleClass="p-datatable-sm" [value]="fake" responsiveLayout="scroll" class="pt-4" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header">
          <tr>
            <th class="number">Id</th>
            <th>Name</th>
            <th>Description</th>
            <th class="number">UnitPrice</th>
            <th class="number">StockQuantity</th>
            <th>User</th>
            <th class="number">Version</th>
            <th>CreatedAt</th>
            <th>ModifiedAt</th>

            <th><div style="text-align: center">Actions</div></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr [pSelectableRow]="item" style="font-family: 'Courier New', Courier, monospace;">
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
          </tr>
        </ng-template>
      </p-table>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="hidden lg:block"
                   [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true"
                   currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
      </p-paginator>

      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="lg:hidden block"
                   (onPageChange)="paginate($event)" [pageLinkSize]="2">
      </p-paginator>
    </ng-template>
  </p-card>
</p-panel>
