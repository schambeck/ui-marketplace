<app-page-header title="Encontre sua próxima descoberta" description="Explore produtos, compare ofertas e escolha o que combina com você." section="Catálogo"></app-page-header>
<section class="catalog-search" aria-label="Busca no catálogo">
  <span class="p-input-icon-left"><i class="pi pi-search" aria-hidden="true"></i><input type="search" pInputText placeholder="O que você está procurando?" aria-label="Buscar no catálogo" (input)="search(getValue($event))" /></span>
  <p-button label="Atualizar" icon="pi pi-refresh" [outlined]="true" (onClick)="refresh(currentText)" [loading]="loading"></p-button>
</section>
<app-ui-state *ngIf="error" icon="pi-exclamation-circle" title="Não foi possível carregar as ofertas" description="Tente atualizar o catálogo em instantes."></app-ui-state>
<ng-container *ngIf="page$ | async as page; else skeleton">
  <div class="catalog-meta">{{page.totalElements}} ofertas encontradas</div>
  <div class="catalog-grid">
    <ng-container *ngFor="let offer of page.content">
      <article class="product-card" *ngIf="offer.product as product">
        <button class="product-visual" type="button" (click)="navigateToDetail(offer)" [attr.aria-label]="'Ver ' + product.name"><img [src]="getImageUrl(product.objectId)" [alt]="product.name" loading="lazy" /></button>
        <div class="product-body">
          <div class="product-category">{{product.category}}</div>
          <button type="button" class="product-title" (click)="navigateToDetail(offer)">{{product.name}}</button>
          <ng-container *ngIf="offer.context as context"><p class="product-context" *ngIf="context.game">{{context.game}}<span *ngIf="context.platform"> · {{context.platform}}</span></p></ng-container>
          <ng-container *ngIf="product.user as seller"><p class="seller-name" *ngIf="seller.fullName">Vendido por {{seller.fullName}}</p></ng-container>
          <p-rating *ngIf="product.rating" [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>
          <p-tag [value]="offer.availabilityStatus | statusLabel" [severity]="getAvailabilitySeverity(offer)"></p-tag>
          <div class="product-purchase"><strong>{{offer.price | currency}}</strong><p-button icon="pi pi-shopping-cart" ariaLabel="Adicionar ao carrinho" (onClick)="addCartItem(offer)" [loading]="saving" [disabled]="!canPurchase(offer)"></p-button></div>
        </div>
      </article>
    </ng-container>
  </div>
  <app-ui-state *ngIf="page.content.length === 0" icon="pi-search" title="Nenhuma oferta encontrada" description="Experimente outro termo ou volte para conferir novas ofertas."></app-ui-state>
  <p-paginator [first]="currentPage * rows" [rows]="rows" [totalRecords]="totalElements" [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true" currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} ofertas"></p-paginator>
</ng-container>
<ng-template #skeleton><div *ngIf="!error" class="catalog-grid" aria-label="Carregando ofertas" role="status"><div *ngFor="let item of fake" class="product-card"><p-skeleton height="180px"></p-skeleton><div class="product-body"><p-skeleton height="24px"></p-skeleton><p-skeleton height="60px" styleClass="mt-3"></p-skeleton></div></div></div></ng-template>
