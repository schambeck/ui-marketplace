<app-page-header title="Meus pedidos" description="Acompanhe suas compras e consulte os detalhes de cada pedido." section="Minha conta"></app-page-header>
<div>
  <section class="data-surface">
    <p-card>
      <ng-template pTemplate="header">
        <div class="flex justify-content-end p-3">
          <p-button label="Atualizar" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading"></p-button>
        </div>
      </ng-template>

      <p-message *ngIf="error" severity="error" text="Não foi possível carregar seus pedidos."></p-message>

      <ng-container *ngIf="page$ | async as page; else loadingTemplate">
        <p-table [value]="page.content" responsiveLayout="scroll" dataKey="publicId">
          <ng-template pTemplate="header">
            <tr><th>Referência</th><th>Status</th><th class="money">Subtotal</th><th class="money">Total</th><th></th></tr>
          </ng-template>
          <ng-template pTemplate="body" let-order>
            <tr (click)="open(order)" class="cursor-pointer">
              <td>{{order.publicId}}</td>
              <td><p-tag [value]="order.status | statusLabel" [severity]="getSeverity(order.status)"></p-tag></td>
              <td class="money">{{order.subtotalAmount | currency}}</td>
              <td class="money">{{order.totalAmount | currency}}</td>
              <td><p-button label="Ver detalhes" icon="pi pi-eye" size="small" (onClick)="$event.stopPropagation(); open(order)"></p-button></td>
            </tr>
          </ng-template>
        </p-table>
        <app-ui-state *ngIf="page.content.length === 0" icon="pi-shopping-bag" title="Suas compras aparecem aqui" description="Explore o catálogo e encontre sua próxima compra."></app-ui-state>
      </ng-container>

      <ng-template #loadingTemplate>
        <p-table [value]="skeletonRows"><ng-template pTemplate="body" let-row><tr><td colspan="5"><p-skeleton></p-skeleton></td></tr></ng-template></p-table>
      </ng-template>

      <ng-template pTemplate="footer">
        <p-paginator [rows]="rows" [totalRecords]="totalElements" (onPageChange)="paginate($event)"
          [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"></p-paginator>
      </ng-template>
    </p-card>
  </section>
</div>
