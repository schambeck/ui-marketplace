<div class="p-4" *ngIf="!loading; else loadingTemplate">
  <p-message *ngIf="error" severity="error" text="Não foi possível carregar este pedido."></p-message>
  <ng-container *ngIf="order as current">
    <div class="flex justify-content-between align-items-center mb-4">
      <h1 class="m-0">Pedido</h1><p-tag [value]="current.status"></p-tag>
    </div>
    <p-card>
      <div class="flex justify-content-between"><span>Total</span><strong>{{ current.totalAmount | currency }}</strong></div>
      <div class="flex justify-content-between mt-2"><span>Referência</span><span>{{ current.publicId }}</span></div>
    </p-card>
    <p-button label="Voltar aos meus pedidos" icon="pi pi-arrow-left" class="mt-4" (onClick)="back()"></p-button>
  </ng-container>
</div>
<ng-template #loadingTemplate><div class="flex justify-content-center p-6"><p-progressSpinner></p-progressSpinner></div></ng-template>
