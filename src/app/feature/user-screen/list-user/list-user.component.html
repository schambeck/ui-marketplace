<app-page-header title="Usuários" description="Administre os perfis e os contatos dos usuários." section="Administração"></app-page-header>
<section class="data-surface">
  <p-card class="p-0">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Novo" icon="pi pi-plus" (onClick)="newUser()" [loading]="loading" pTooltip="Novo usuário" styleClass="p-button-success"></p-button>
        </div>
        <div class="p-toolbar-group-end">
          <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input type="text" pInputText placeholder="Buscar" aria-label="Buscar registros" (keyup)="search(getValue($event))" />
          </span>
          <p-button label="Atualizar" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading" pTooltip="Atualizar" tooltipPosition="left"></p-button>
        </div>
      </p-toolbar>
    </ng-template>

    <div *ngIf="page$ | async as page; else skeleton">
      <p-table styleClass="p-datatable-sm" [value]="page.content" responsiveLayout="scroll" class="pt-4" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header">
          <tr>


            <th class="number">Id</th>



            <th>Usuário</th>



            <th>E-mail</th>



            <th>Nome completo</th>



            <th>Atualizado em</th>


            <th><div style="text-align: center">Ações</div></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
          <tr [pSelectableRow]="user">


            <td (click)="navigateToDetail(user)" class="number">{{user.id | number}}</td>

            <td><button type="button" class="table-link" (click)="navigateToDetail(user)">{{user.username}}</button></td>
            <td (click)="navigateToDetail(user)">{{user.email}}</td>
            <td (click)="navigateToDetail(user)">{{user.fullName}}</td>

            <td (click)="navigateToDetail(user)">{{user.modifiedAt | date:'dd/MM/yyyy'}}</td>

            <td><div style="text-align: center"><button type="button" class="icon-button danger" aria-label="Excluir registro" [disabled]="removing" (click)="remove(user.id)"><i class="pi pi-trash" aria-hidden="true"></i></button></div></td>
          </tr>
        </ng-template>
      </p-table>
      <app-ui-state *ngIf="page.content.length === 0" title="Nenhum registro encontrado" description="Ajuste a busca ou cadastre um novo registro."></app-ui-state>
    </div>

    <app-ui-state *ngIf="error" title="Não foi possível carregar a listagem" description="Use Atualizar para tentar novamente." icon="pi-exclamation-circle"></app-ui-state>
    <ng-template #skeleton><ng-container *ngIf="!error">
      <p-table styleClass="p-datatable-sm" [value]="fake" responsiveLayout="scroll" class="pt-4" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header">
          <tr>


            <th class="number">Id</th>



            <th>Usuário</th>



            <th>E-mail</th>



            <th>Nome completo</th>



            <th>Atualizado em</th>

            <th><div style="text-align: center">Ações</div></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr [pSelectableRow]="item">
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
          </tr>
        </ng-template>
      </p-table>
    </ng-container></ng-template>

    <ng-template pTemplate="footer">
      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="hidden lg:block"
                   [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true"
                   currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros">
      </p-paginator>

      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="lg:hidden block"
                   (onPageChange)="paginate($event)" [pageLinkSize]="2">
      </p-paginator>
    </ng-template>
  </p-card>
</section>
