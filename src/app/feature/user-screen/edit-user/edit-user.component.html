<p-panel header="Usuário">
  <p-card class="p-0 shadow-8">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Voltar" (onClick)="back()" icon="pi pi-arrow-left" styleClass="mr-2"></p-button>
          <p-button label="Salvar" (onClick)="save()" icon="pi pi-save" [loading]="saving"></p-button>
        </div>
        <div class="p-toolbar-group-end">
          <p-button label="Iniciar fluxo" (onClick)="startFlow()" icon="pi pi-file-export" styleClass="p-button-secondary"></p-button>
        </div>
      </p-toolbar>
    </ng-template>
    <div *ngIf="user$ | async as user else loading" class="grid">

      <div class="field col-12 md:col-6">
        <label for="id" class="block font-bold">Id</label>
        <p-inputNumber inputId="id" [size]="25" [(ngModel)]="user.id" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="username" class="block font-bold">Usuário</label>
        <input id="username" type="text" class="w-full" [(ngModel)]="user.username" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="email" class="block font-bold">E-mail</label>
        <input id="email" type="text" class="w-full" [(ngModel)]="user.email" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="fullName" class="block font-bold">Nome completo</label>
        <input id="fullName" type="text" class="w-full" [(ngModel)]="user.fullName" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="publicKey" class="block font-bold">Chave pública</label>
        <input id="publicKey" type="text" class="w-full" [(ngModel)]="user.publicKey" [disabled]="true" pInputText >
      </div>
      <div class="field col-12 md:col-6">
        <label for="publicKeyModifiedAt" class="block font-bold">Chave pública atualizada em</label>
        <p-calendar inputId="publicKeyModifiedAt" dateFormat="yy-mm-dd" [(ngModel)]="user.publicKeyModifiedAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

      <div class="field col-12 md:col-6">
        <label for="version" class="block font-bold">Versão</label>
        <p-inputNumber inputId="version" [size]="25" [(ngModel)]="user.version" [disabled]="true"></p-inputNumber>
      </div>

      <div class="field col-12 md:col-6">
        <label for="createdAt" class="block font-bold">Criado em</label>
        <p-calendar inputId="createdAt" dateFormat="yy-mm-dd" [(ngModel)]="user.createdAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

      <div class="field col-12 md:col-6">
        <label for="modifiedAt" class="block font-bold">Atualizado em</label>
        <p-calendar inputId="modifiedAt" dateFormat="yy-mm-dd" [(ngModel)]="user.modifiedAt" [showIcon]="true" dataType="string" [disabled]="true"/>
      </div>

    </div>
    <ng-template #loading>
      <div class="grid">
        <div class="field col-12 md:col-6"><label for="id" class="block font-bold">Id</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="username" class="block font-bold">Usuário</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="email" class="block font-bold">E-mail</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="fullName" class="block font-bold">Nome completo</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="version" class="block font-bold">Versão</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="createdAt" class="block font-bold">Criado em</label><p-skeleton height="2.75rem"></p-skeleton></div>
        <div class="field col-12 md:col-6"><label for="modifiedAt" class="block font-bold">Atualizado em</label><p-skeleton height="2.75rem"></p-skeleton></div>
      </div>
    </ng-template>
  </p-card>
</p-panel>
