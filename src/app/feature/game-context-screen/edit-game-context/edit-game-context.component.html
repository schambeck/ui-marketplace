<p-panel header="Contexto de jogo">
  <p-card class="p-0 shadow-8">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Voltar" (onClick)="back()" icon="pi pi-arrow-left" styleClass="mr-2"></p-button>
          <p-button label="Salvar" (onClick)="save()" icon="pi pi-save" [loading]="saving" [disabled]="(context$ | async)?.status === 'DISCONTINUED'"></p-button>
        </div>
      </p-toolbar>
    </ng-template>

    <div *ngIf="context$ | async as context" class="grid">
      <div class="field col-12 md:col-6"><label for="id" class="block font-bold">Id</label><p-inputNumber inputId="id" [(ngModel)]="context.id" [disabled]="true"></p-inputNumber></div>
      <div class="field col-12 md:col-6"><label for="version" class="block font-bold">Versão</label><p-inputNumber inputId="version" [(ngModel)]="context.version" [disabled]="true"></p-inputNumber></div>
      <div class="field col-12 md:col-6"><label for="game" class="block font-bold">Jogo *</label><input id="game" type="text" class="w-full" [(ngModel)]="context.game" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="platform" class="block font-bold">Plataforma *</label><input id="platform" type="text" class="w-full" [(ngModel)]="context.platform" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="publisher" class="block font-bold">Publicadora</label><input id="publisher" type="text" class="w-full" [(ngModel)]="context.publisher" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="region" class="block font-bold">Região</label><input id="region" type="text" class="w-full" [(ngModel)]="context.region" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="server" class="block font-bold">Servidor</label><input id="server" type="text" class="w-full" [(ngModel)]="context.server" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="variant" class="block font-bold">Variante</label><input id="variant" type="text" class="w-full" [(ngModel)]="context.variant" pInputText [disabled]="isTerminal(context)" /></div>
      <div class="field col-12 md:col-6"><label for="status" class="block font-bold">Status</label><p-dropdown inputId="status" [options]="statuses" [(ngModel)]="context.status" [disabled]="isTerminal(context)"><ng-template pTemplate="item" let-status>{{status | statusLabel}}</ng-template><ng-template pTemplate="selectedItem" let-status>{{status | statusLabel}}</ng-template></p-dropdown></div>
      <div class="field col-12 md:col-6"><label for="createdAt" class="block font-bold">Criado em</label><input id="createdAt" type="text" class="w-full" [value]="context.createdAt" disabled pInputText /></div>
      <div class="field col-12 md:col-6"><label for="modifiedAt" class="block font-bold">Atualizado em</label><input id="modifiedAt" type="text" class="w-full" [value]="context.modifiedAt" disabled pInputText /></div>
      <div class="field col-12" *ngIf="context.id && !isTerminal(context)"><p-button label="Descontinuar" icon="pi pi-ban" severity="danger" (onClick)="discontinue(context)"></p-button></div>
    </div>

    <div *ngIf="history$ | async as history" class="mt-4">
      <h3>Histórico</h3>
      <p-table [value]="history" styleClass="p-datatable-sm" responsiveLayout="scroll">
        <ng-template pTemplate="header"><tr><th>Ação</th><th>Status</th><th>Alterado por</th><th>Registrado em</th></tr></ng-template>
        <ng-template pTemplate="body" let-entry><tr><td>{{ entry.action }}</td><td>{{ entry.status }}</td><td>{{ entry.changedBy || '—' }}</td><td>{{ entry.recordedAt }}</td></tr></ng-template>
      </p-table>
    </div>
    <p-progressSpinner *ngIf="loadingHistory"></p-progressSpinner>
  </p-card>
  <p-confirmDialog></p-confirmDialog>
</p-panel>
