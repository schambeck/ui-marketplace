<p-sidebar [(visible)]="display">
    <app-sidebar [(display)]="display"></app-sidebar>
</p-sidebar>

<p-toolbar>
    <div class="p-toolbar-group-left">
        <p-button icon="pi pi-bars" [text]="true" (click)="toggleMenuDisplay()" pTooltip="Toggle Menu Display" tooltipPosition="bottom" [showDelay]="1000"></p-button>
        <p-image src="assets/logo-angular.svg" (click)="display = true" alt="Swap" class="cursor-pointer" height="33" width="116" />
    </div>
    <div class="p-toolbar-group-right">
        <div *ngIf="authService.isLoggedIn()">
          <app-shopping-cart></app-shopping-cart>
        </div>
        <app-logged-user></app-logged-user>
    </div>
</p-toolbar>
