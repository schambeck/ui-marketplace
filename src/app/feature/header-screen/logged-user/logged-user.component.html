<ng-container *ngIf="authService.isLoggedIn(); else checking">
  <p-menu [popup]="true" [model]="items" #menu></p-menu>
  <p-button icon="pi pi-user" [text]="true" pTooltip="User Profile" tooltipPosition="bottom" [showDelay]="1000" (click)="menu.toggle($event)"></p-button>
</ng-container>

<ng-template #checking>
  <p-button *ngIf="!authService.isLoggedIn(); else spinner" (click)="authService.login()" icon="pi pi-sign-in" [text]="true" pTooltip="Log in" tooltipPosition="bottom" [showDelay]="1000"></p-button>
  <ng-template #spinner>
    <p-progressSpinner [style]="{width: '22px', height: '22px'}"></p-progressSpinner>
  </ng-template>
</ng-template>
