<p-panel header="Offer">
  <p-card class="p-0 shadow-8">
    <ng-template pTemplate="header"><p-toolbar><div class="p-toolbar-group-start"><p-button label="Back" icon="pi pi-arrow-left" (onClick)="back()"></p-button></div></p-toolbar></ng-template>
    <div *ngIf="offer$ | async as offer" class="grid">
      <div class="field col-3"><label class="block font-bold">Id</label><p-inputNumber [(ngModel)]="offer.id" [disabled]="true"></p-inputNumber></div>
      <div class="field col-3"><label class="block font-bold">Product Id</label><p-inputNumber [(ngModel)]="offer.productId" [disabled]="true"></p-inputNumber></div>
      <div class="field col-3"><label class="block font-bold">Context Id</label><p-inputNumber [(ngModel)]="offer.gameContextId" [disabled]="true"></p-inputNumber></div>
      <div class="field col-3"><label class="block font-bold">Version</label><p-inputNumber [(ngModel)]="offer.version" [disabled]="true"></p-inputNumber></div>
      <div class="field col-6"><label class="block font-bold">Context</label><input class="w-full" pInputText [value]="contextLabel(offer)" disabled /></div>
      <div class="field col-3"><label class="block font-bold">Price</label><p-inputNumber [(ngModel)]="offer.price" mode="currency" currency="USD" [disabled]="offer.status !== 'DRAFT'"></p-inputNumber></div>
      <div class="field col-3"><label class="block font-bold">Status</label><p-tag [value]="offer.status"></p-tag></div>
      <div class="field col-6"><label class="block font-bold">Delivery method</label><input class="w-full" pInputText [(ngModel)]="offer.deliveryMethod" [disabled]="offer.status !== 'DRAFT'" /></div>
      <div class="field col-6"><label class="block font-bold">Availability source</label><input class="w-full" pInputText [(ngModel)]="offer.availabilitySource" [disabled]="offer.status !== 'DRAFT'" /></div>
      <div class="field col-6"><label class="block font-bold">Availability</label><p-dropdown [options]="availabilityStatuses" [(ngModel)]="offer.availabilityStatus" [disabled]="offer.status === 'RETIRED'"></p-dropdown></div>
      <div class="field col-6"><label class="block font-bold">Reason *</label><input class="w-full" pInputText [(ngModel)]="reason" /></div>
      <div class="field col-6"><label class="block font-bold">Source *</label><input class="w-full" pInputText [(ngModel)]="source" /></div>
      <div class="field col-12 flex gap-2 flex-wrap">
        <p-button label="Save draft" icon="pi pi-save" (onClick)="saveDraft()" [loading]="saving" [disabled]="offer.status !== 'DRAFT'"></p-button>
        <p-button label="Publish" icon="pi pi-check" severity="success" (onClick)="transition('publish')" [loading]="saving" [disabled]="!canTransition('publish')"></p-button>
        <p-button label="Pause" icon="pi pi-pause" severity="warning" (onClick)="transition('pause')" [loading]="saving" [disabled]="!canTransition('pause')"></p-button>
        <p-button label="Reactivate" icon="pi pi-play" severity="success" (onClick)="transition('reactivate')" [loading]="saving" [disabled]="!canTransition('reactivate')"></p-button>
        <p-button label="Retire" icon="pi pi-ban" severity="danger" (onClick)="transition('retire')" [loading]="saving" [disabled]="!canTransition('retire')"></p-button>
        <p-button label="Save availability" icon="pi pi-refresh" (onClick)="changeAvailability()" [loading]="saving" [disabled]="offer.status === 'RETIRED'"></p-button>
      </div>
    </div>
    <div *ngIf="history$ | async as history" class="mt-4"><h3>History</h3><p-table [value]="history" styleClass="p-datatable-sm" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th>From</th><th>To</th><th>Reason</th><th>Source</th><th>Changed by</th><th>Recorded at</th></tr></ng-template><ng-template pTemplate="body" let-entry><tr><td>{{ entry.fromStatus || '—' }}</td><td>{{ entry.toStatus }}</td><td>{{ entry.reason }}</td><td>{{ entry.source }}</td><td>{{ entry.changedBy || '—' }}</td><td>{{ entry.recordedAt }}</td></tr></ng-template></p-table></div>
    <p-progressSpinner *ngIf="loadingHistory"></p-progressSpinner>
  </p-card>
</p-panel>
