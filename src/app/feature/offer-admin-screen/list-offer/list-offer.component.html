<app-page-header title="Minhas ofertas" description="Acompanhe publicação e disponibilidade em colunas independentes." section="Vendas"></app-page-header>
<section class="data-surface">
  <p-card class="p-0">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-dropdown ariaLabel="Filtrar por publicação" [options]="statuses" [(ngModel)]="selectedStatus" optionLabel="label" optionValue="value" (onChange)="statusChanged()"></p-dropdown>
        </div>
        <div class="p-toolbar-group-end">
          <span class="p-input-icon-left pr-2"><i class="pi pi-search"></i><input type="text" pInputText placeholder="Buscar ofertas" aria-label="Buscar ofertas" (keyup)="search(getValue($event))" /></span>
          <p-button label="Atualizar" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading"></p-button>
        </div>
      </p-toolbar>
    </ng-template>

    <div *ngIf="page$ | async as page; else skeleton">
      <p-table styleClass="p-datatable-sm" [value]="page.content" responsiveLayout="scroll" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header"><tr><th>Id</th><th>Produto</th><th>Contexto</th><th class="money">Preço</th><th>Disponibilidade</th><th>Status</th><th>Versão</th></tr></ng-template>
        <ng-template pTemplate="body" let-offer>
          <tr [pSelectableRow]="offer" (click)="navigateToDetail(offer)" tabindex="0" (keydown.enter)="navigateToDetail(offer)">
            <td>{{ offer.id }}</td>
            <td>{{ offer.product?.name || ('Produto #' + offer.productId) }}</td>
            <td>{{ offer.context?.game }} · {{ offer.context?.platform }}</td>
            <td class="money">{{ offer.price | currency }}</td>
            <td><p-tag [value]="offer.availabilityStatus | statusLabel" [severity]="offer.availabilityStatus === 'AVAILABLE' ? 'success' : 'danger'"></p-tag></td>
            <td><p-tag [value]="offer.status | statusLabel" [severity]="getSeverity(offer.status)"></p-tag></td>
            <td>{{ offer.version }}</td>
          </tr>
        </ng-template>
      </p-table>
      <app-ui-state *ngIf="page.content.length === 0" title="Nenhuma oferta encontrada." description="Ajuste a busca ou atualize a listagem."></app-ui-state>
    </div>

    <app-ui-state *ngIf="error" title="Não foi possível carregar a listagem" description="Use Atualizar para tentar novamente." icon="pi-exclamation-circle"></app-ui-state>
    <ng-template #skeleton><ng-container *ngIf="!error"><p-table [value]="fake"><ng-template pTemplate="body" let-item><tr><td *ngFor="let column of [1,2,3,4,5,6,7]"><p-skeleton></p-skeleton></td></tr></ng-template></p-table></ng-container></ng-template>
    <ng-template pTemplate="footer"><p-paginator [rows]="rows" [totalRecords]="totalElements" [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true" currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros"></p-paginator></ng-template>
  </p-card>
</section>
