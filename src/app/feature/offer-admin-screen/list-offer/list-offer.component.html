<p-panel header="Offers">
  <p-card class="p-0">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-dropdown [options]="statuses" [(ngModel)]="selectedStatus" optionLabel="label" optionValue="value" (onChange)="statusChanged()"></p-dropdown>
        </div>
        <div class="p-toolbar-group-end">
          <span class="p-input-icon-left pr-2"><i class="pi pi-search"></i><input type="text" pInputText placeholder="Search offers" (keyup)="search(getValue($event))" /></span>
          <p-button label="Refresh" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading"></p-button>
        </div>
      </p-toolbar>
    </ng-template>

    <div *ngIf="page$ | async as page; else skeleton">
      <p-table styleClass="p-datatable-sm" [value]="page.content" responsiveLayout="scroll" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header"><tr><th>Id</th><th>Product</th><th>Context</th><th>Price</th><th>Availability</th><th>Status</th><th>Version</th></tr></ng-template>
        <ng-template pTemplate="body" let-offer>
          <tr [pSelectableRow]="offer" (click)="navigateToDetail(offer)">
            <td>{{ offer.id }}</td>
            <td>{{ offer.product?.name || ('Product #' + offer.productId) }}</td>
            <td>{{ offer.context?.game }} · {{ offer.context?.platform }}</td>
            <td>{{ offer.price | currency }}</td>
            <td>{{ offer.availabilityStatus }}</td>
            <td><p-tag [value]="offer.status" [severity]="getSeverity(offer.status)"></p-tag></td>
            <td>{{ offer.version }}</td>
          </tr>
        </ng-template>
      </p-table>
      <div *ngIf="page.content.length === 0" class="p-4 text-center">No offers found.</div>
    </div>

    <ng-template #skeleton><p-table [value]="fake"><ng-template pTemplate="body" let-item><tr><td *ngFor="let column of [1,2,3,4,5,6,7]"><p-skeleton></p-skeleton></td></tr></ng-template></p-table></ng-template>
    <ng-template pTemplate="footer"><p-paginator [rows]="rows" [totalRecords]="totalElements" [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"></p-paginator></ng-template>
  </p-card>
</p-panel>
