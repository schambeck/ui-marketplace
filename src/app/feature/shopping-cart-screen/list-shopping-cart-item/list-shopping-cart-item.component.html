<app-page-header title="Meu carrinho" description="Revise os itens e as quantidades antes de finalizar sua compra." section="Sua compra"></app-page-header>
<span id="wallet_container"></span>
<p-progressSpinner *ngIf="creating" ariaLabel="Adicionando produto"></p-progressSpinner>
<div class="cart-layout">
  <section class="cart-items" aria-label="Itens do carrinho">
    <p-toolbar><div class="p-toolbar-group-start"><p-button label="Continuar comprando" icon="pi pi-arrow-left" [text]="true" (onClick)="back()"></p-button></div><div class="p-toolbar-group-end"><span class="p-input-icon-left"><i class="pi pi-search" aria-hidden="true"></i><input pInputText type="search" aria-label="Buscar no carrinho" placeholder="Buscar item" (input)="search(getValue($event))"></span><p-button icon="pi pi-refresh" ariaLabel="Atualizar carrinho" [outlined]="true" [loading]="loading" (onClick)="refresh(currentText)"></p-button></div></p-toolbar>
    <ng-container *ngIf="page$ | async as page; else busy">
      <article *ngFor="let item of page.content" class="cart-item">
        <p-image [src]="getImageUrl(item.product.objectId)" [alt]="item.product.name" [preview]="true"></p-image>
        <div class="cart-item-info"><button type="button" class="table-link" (click)="navigateToDetail(item.offerId)">{{item.product.name}}</button><span class="help-text">{{item.product.category}}</span><p-rating *ngIf="item.product.rating" [ngModel]="item.product.rating" [readonly]="true" [cancel]="false"></p-rating><span class="help-text">{{item.price | currency}} por unidade</span><label class="help-text" [for]="'quantity-' + item.id">Quantidade</label><p-inputNumber [(ngModel)]="item.quantity" (ngModelChange)="onModelChange(item.id, $event)" [inputId]="'quantity-' + item.id" [showButtons]="true" buttonLayout="horizontal" [step]="1" [disabled]="updating" incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus"></p-inputNumber></div>
        <div class="cart-item-actions"><strong>{{item.price * item.quantity | currency}}</strong><button type="button" class="icon-button danger" [attr.aria-label]="'Remover ' + item.product.name" [disabled]="removing" (click)="remove(item.id.toString())"><i class="pi pi-trash" aria-hidden="true"></i></button></div>
      </article>
      <app-ui-state *ngIf="!page.content.length" icon="pi-shopping-cart" title="Seu carrinho está vazio" description="Explore o catálogo para encontrar seu próximo item."></app-ui-state>
      <p-paginator [rows]="rows" [totalRecords]="totalElements" [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [pageLinkSize]="2"></p-paginator>
    </ng-container>
    <ng-template #busy><div *ngIf="!error" class="p-4" role="status" aria-label="Carregando carrinho"><p-skeleton *ngFor="let item of fake" height="80px" styleClass="mb-3"></p-skeleton></div></ng-template>
    <app-ui-state *ngIf="error" title="Não foi possível carregar o carrinho" description="Atualize a página para tentar novamente." icon="pi-exclamation-circle"></app-ui-state>
  </section>
  <aside class="cart-summary" aria-label="Resumo da compra"><h2>Resumo da compra</h2><ng-container *ngIf="cart$ | async as cart; else summaryLoading"><p>Confira os itens antes de continuar para o pedido.</p><div class="summary-total"><span>Total</span><strong>{{cart.total | currency}}</strong></div><p-button label="Finalizar compra" icon="pi pi-arrow-right" [loading]="checkingOut" [disabled]="!cart.total || updating || removing || loading" (onClick)="checkout()"></p-button></ng-container><ng-template #summaryLoading><p-skeleton height="100px"></p-skeleton></ng-template></aside>
</div>
