<p-panel header="Cart">
  <div *ngIf="cart$ | async as cart; else skeletonCart" class="pt-4 pb-4 flex flex-column justify-content-center flex-wrap">
    <div class="flex align-items-center justify-content-center text-3xl cart-total">
      Your cart total is {{ cart.total | currency }}
      <p-button label="Checkout" (onClick)="back()" icon="pi pi-shopping-cart" class="pl-2"></p-button>
    </div>
  </div>
  <ng-template #skeletonCart>
  </ng-template>
  <p-card class="p-0">
    <ng-template pTemplate="header">
      <p-toolbar>
        <div class="p-toolbar-group-start">
          <p-button label="Catalog" (onClick)="back()" icon="pi pi-arrow-left" styleClass="mr-2" severity="secondary"></p-button>
        </div>
        <div class="p-toolbar-group-end">
          <span class="p-input-icon-left pr-2">
              <i class="pi pi-search"></i>
              <input type="text" pInputText placeholder="Search" (keyup)="search(getValue($event))" />
          </span>
          <p-button label="Refresh" icon="pi pi-refresh" (onClick)="refresh()" [loading]="loading" pTooltip="Refresh" tooltipPosition="left"></p-button>
        </div>
      </p-toolbar>
    </ng-template>
    <div *ngIf="page$ | async as page; else skeleton">
      <p-dataView #dv [value]="page.content" [layout]="'list'">
        <ng-template let-item pTemplate="list" let-items>
          <div class="grid grid-nogutter">
            <div class="col-12" *ngFor="let item of items; let first = first">
              <div class="flex flex-column xl:flex-row xl:align-items-start p-4 gap-4" [ngClass]="{ 'border-top-1 surface-border': !first }">
                <img (click)="navigateToDetail(item.product)" class="cursor-pointer w-9 sm:w-16rem xl:w-10rem shadow-2 block xl:block mx-auto border-round" [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + item.product.image" [alt]="item.product.name" />
                <div class="flex flex-column sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                  <div class="flex flex-column align-items-center sm:align-items-start gap-3">
                    <div (click)="navigateToDetail(item.product)" class="cursor-pointer text-2xl font-bold text-900">{{ item.product.name }}</div>
                    <p-rating [ngModel]="item.product.rating" [readonly]="true" [cancel]="false"></p-rating>
                    <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                    <i class="pi pi-tag"></i>
                                    <span class="font-semibold">{{ item.product.category }}</span>
                                </span>
                      <p-tag [value]="item.product.inventoryStatus" [severity]="getSeverity(item.product)"></p-tag>
                    </div>
                  </div>
                  <div class="flex sm:flex-column align-items-center sm:align-items-end gap-3 sm:gap-2">
                    <span class="text-2xl font-semibold">{{ (item.price * item.quantity) | currency }}</span>
                    <i class="pi pi-trash" (click)="remove(item.id)" style="color: lightcoral"></i>
                    <p-inputNumber id="quantity"
                                   [(ngModel)]="item.quantity"
                                   (ngModelChange)="onModelChange(item.id, $event)"
                                   [showButtons]="true"
                                   buttonLayout="horizontal"
                                   inputId="horizontal"
                                   [step]="1"
                                   [disabled]="saving"
                                   decrementButtonClass="p-button-danger"
                                   incrementButtonClass="p-button-success"
                                   incrementButtonIcon="pi pi-plus"
                                   decrementButtonIcon="pi pi-minus"
                                   class="pt-2" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </p-dataView>
    </div>

    <ng-template #skeleton>
      <p-table styleClass="p-datatable-sm" [value]="fake" responsiveLayout="scroll" class="pt-4" selectionMode="single" dataKey="id">
        <ng-template pTemplate="header">
          <tr>
            <th class="number">Id</th>
            <th>Name</th>
            <th>Description</th>
            <th class="number">Price</th>
            <th class="number">Quantity</th>
            <th>User</th>
            <th class="number">Version</th>
            <th>CreatedAt</th>
            <th>ModifiedAt</th>

            <th><div style="text-align: center">Actions</div></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr [pSelectableRow]="item" style="font-family: 'Courier New', Courier, monospace;">
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
            <td><p-skeleton></p-skeleton></td>
          </tr>
        </ng-template>
      </p-table>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="hidden lg:block"
                   [rowsPerPageOptions]="[5,10,25,50]" (onPageChange)="paginate($event)" [showCurrentPageReport]="true"
                   currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
      </p-paginator>

      <p-paginator [rows]="rows" [totalRecords]="totalElements" class="lg:hidden block"
                   (onPageChange)="paginate($event)" [pageLinkSize]="2">
      </p-paginator>
    </ng-template>
  </p-card>
</p-panel>
